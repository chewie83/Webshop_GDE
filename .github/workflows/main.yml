name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install Backend dependencies
      run: cd Backend && npm install
      
    - name: Run Backend Tests
      run: cd Backend && npm test
      env:
        NODE_ENV: test
        DATABASE_URL: "file:./test.db" # Egy ideiglenes adatbázist használ a teszthez